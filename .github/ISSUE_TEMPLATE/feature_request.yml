name: Feature Request (ขอฟีเจอร์ใหม่)
description: เสนอฟีเจอร์ใหม่หรือการปรับปรุงสำหรับโปรเจกต์ ESP32
title: "[Feat]: "
labels: ["enhancement"]

body:
  # TODO (LAB02 - ส่วนที่ 1): เพิ่ม field `textarea` (id: problem, required: true)
